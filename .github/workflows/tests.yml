name: Tests

on:
  push:
    branches:
      - master
      - main
      - '*.x'
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, redis, gd, intl, bcmath, opcache, tokenizer, xml, xmlwriter, json
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Configure testing environment
        # PREPENDED, not appended. PHP Dotenv is immutable - the FIRST
        # definition of a key wins - so appending these after the values
        # copied from .env.example left them inert. MAIL_MAILER stayed
        # "resend" with an empty key, so every send failed silently and any
        # test asserting "no mail was sent" passed for the wrong reason.
        run: |
          {
            echo "APP_ENV=testing"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=:memory:"
            echo "CACHE_STORE=array"
            echo "SESSION_DRIVER=array"
            echo "QUEUE_CONNECTION=sync"
            echo "MAIL_MAILER=array"
            echo "BCRYPT_ROUNDS=4"
            echo "YO_PAYMENTS_IPN_ENABLED=false"
            echo "UG_SMS_USERNAME=test"
            echo "UG_SMS_PASSWORD=test"
            echo "YO_PAYMENTS_USERNAME=test"
            echo "YO_PAYMENTS_PASSWORD=test"
            cat .env
          } > .env.testing
          mv .env.testing .env
          echo "--- effective settings (first definition of each key wins) ---"
          grep -m1 -E '^MAIL_MAILER=' .env
          grep -m1 -E '^CACHE_STORE=' .env
          grep -m1 -E '^DB_CONNECTION=' .env

      - name: Create storage directories
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p storage/app/public

      - name: Set permissions
        run: |
          chmod -R 775 storage
          chmod -R 775 bootstrap/cache

      - name: Clear and cache config
        # config:cache is deliberately NOT run before the test suite. It bakes
        # .env values into the cached config, after which env() returns null
        # and every <env> in phpunit.xml is ignored - which is how the mailer
        # above went unnoticed. Route and view caching do not have that effect.
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan route:cache
          php artisan view:clear
          php artisan view:cache

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --coverage --min=0
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
