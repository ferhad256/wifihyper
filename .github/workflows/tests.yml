name: Tests

on:
  push:
    branches:
      - master
      - main
      - '*.x'
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, redis, gd, intl, bcmath, opcache, tokenizer, xml, xmlwriter, json
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Configure testing environment
        # Appended, so these override the values copied from .env.example.
        # CACHE_STORE, not CACHE_DRIVER: Laravel 11+ reads CACHE_STORE, so the
        # old key was inert and the cache silently fell back to the database.
        run: |
          {
            echo "APP_ENV=testing"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=:memory:"
            echo "CACHE_STORE=array"
            echo "SESSION_DRIVER=array"
            echo "QUEUE_CONNECTION=sync"
            echo "MAIL_MAILER=array"
            # .env.example sets MAIL_FROM_ADDRESS to an EMPTY string, and
            # env() treats that as a value, so the config default never
            # applied and Symfony rejected every message with "An email must
            # have a From or a Sender header". No successful send was
            # verifiable in CI until this was set.
            echo "MAIL_FROM_ADDRESS=ci@wifihyper.test"
            echo "MAIL_FROM_NAME=WifiHyperCI"
            echo "BCRYPT_ROUNDS=4"
            echo "YO_PAYMENTS_IPN_ENABLED=false"
            echo "UG_SMS_USERNAME=test"
            echo "UG_SMS_PASSWORD=test"
            echo "YO_PAYMENTS_USERNAME=test"
            echo "YO_PAYMENTS_PASSWORD=test"
          } >> .env

      - name: Create storage directories
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p storage/app/public

      - name: Set permissions
        run: |
          chmod -R 775 storage
          chmod -R 775 bootstrap/cache

      - name: Clear and cache config
        # config:cache is deliberately NOT run before the test suite. It bakes
        # .env values into the cached config, after which env() returns null
        # and every <env> in phpunit.xml is ignored - which is how the mailer
        # above went unnoticed. Route and view caching do not have that effect.
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan route:cache
          php artisan view:clear
          php artisan view:cache

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --coverage --min=0
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
